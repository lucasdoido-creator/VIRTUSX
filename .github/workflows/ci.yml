# Engrenagem automática: testa cada envio no Windows e no Linux (com e sem base de fusos),
# roda o teste de navegador e, se algo quebrar na branch principal, abre/atualiza uma issue
# "CI falhando" — o GitHub notifica por e-mail/app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # toda segunda 06:17 (Brasília): pega quebras causadas por dependências novas
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  testes:
    name: Testes (${{ matrix.os }} · fusos ${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        tz: [oficial, embutido]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Simular Windows sem tzdata
        if: matrix.tz == 'embutido'
        shell: bash
        run: echo "FORCE_TZ_FALLBACK=1" >> "$GITHUB_ENV"
      - run: python -m pytest -q

  navegador:
    name: Teste de navegador (Chromium)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Instalar Playwright
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Subir servidor e rodar E2E
        env:
          DATA_DIR: /tmp/e2e-data
          SCHEDULER_INTERVAL_S: "3"
          E2E_RESTART: >-
            pkill -f "[u]vicorn"; sleep 4;
            (DATA_DIR=/tmp/e2e-data SCHEDULER_INTERVAL_S=3 setsid ./run.sh >> /tmp/server.log 2>&1 &); sleep 4
        run: |
          (setsid ./run.sh > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          mkdir -p /tmp/shots
          node scripts/e2e.mjs http://127.0.0.1:8000 /tmp/shots
      - name: E2E da operação real (produção limpa)
        run: |
          (cd server && APP_ENV=production DATA_DIR=/tmp/prod-data setsid python -m uvicorn app.main:create_app --factory --port 8001 > /tmp/server-prod.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health && break; sleep 1; done
          node scripts/e2e_producao.mjs http://127.0.0.1:8001 /tmp/shots
      - name: E2E do mapa real, comandos e atendimento (baixa o mapa Natural Earth de verdade)
        run: |
          (cd server && DATA_DIR=/tmp/mapa-data setsid python -m uvicorn app.main:create_app --factory --port 8002 > /tmp/server-mapa.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8002/api/health && break; sleep 1; done
          REQUIRE_REAL_MAP=1 node scripts/e2e_mapa_canais.mjs http://127.0.0.1:8002 /tmp/shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e-log
          path: |
            /tmp/shots
            /tmp/server.log
            /tmp/server-prod.log
            /tmp/server-mapa.log

  notificar:
    name: Notificar falha
    runs-on: ubuntu-latest
    needs: [testes, navegador]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "CI falhando na main";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "ci-falhou" });
            const body = `Execução com falha: ${run}\nCommit: ${context.sha}\n\nPara correção automática (opcional), comente \`@claude corrija a falha do CI\`.`;
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["ci-falhou"] });

  fechar-alerta:
    name: Fechar alerta quando voltar a passar
    runs-on: ubuntu-latest
    needs: [testes, navegador]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "ci-falhou" });
            for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `Voltou a passar em ${context.sha}.` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
            }
